[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tele-mahjong-riichi"
version = "0.1.0"
description = "Riichi Mahjong Telegram bot"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot>=21.0,<23",
  "python-dotenv>=1.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
